[project]
name = "papeete-actor-synchronous-messaging-http"
version = "0.3.0"
description = "An HTTP binding for papeete-actor-synchronous-messaging — a Mailbox adapter, deployable as a real service."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Papeete Consulting", email = "yoann.remy@outlook.com" }]
license = "MIT"
keywords = ["agents", "actor-model", "http", "kubernetes"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]

# ONE *REQUIRED* DEPENDENCY. `Mailbox` (mailbox.py, this package's whole surface) implements
# the port `papeete-actor-synchronous-messaging` already declares (`Mailbox` in its own
# `mailbox.py`) — nothing here re-authors the membrane, the card contract, or `Actor` itself.
# Stdlib only beyond that: `http.server` and `urllib.request`, the same choice every small HTTP
# actor in this ecosystem already makes (`papeete-actor`'s `car-inspector`, `papeete-deploy`'s
# own customer/waiter demo) — no framework to keep current, no framework to explain to a reader.
# The `[otel]` extra below is the one deliberate exception: optional, lazily imported at every
# call site in `_tracing.py` (mirroring `Engine.resolve()`'s own lazy-import discipline for
# vendor adapters), a true no-op when absent.
dependencies = ["papeete-actor-synchronous-messaging>=0.2.1"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# `opentelemetry-sdk` is deliberately NOT here — this package only ever calls the OTel *API*
# (`trace.get_tracer()`, `propagate.inject/extract()`), which is a genuine no-op with no SDK
# configured. Wiring an actual `TracerProvider`/exporter is `papeete-observability`'s job
# (a sibling repo), pulled in by whoever assembles a deployable actor, not by this binding.
otel = ["opentelemetry-api>=1.27"]

[tool.uv.sources]
# `papeete-actor-synchronous-messaging` is now on PyPI (0.2.1), but this checkout still points
# at the sibling so active co-development (ADR-PAS-0012's example rewrite, most recently) lands
# here without a release round-trip first.
papeete-actor-synchronous-messaging = { path = "../papeete-actor-synchronous-messaging", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/papeete_actor_synchronous_messaging_http"]

[tool.pytest.ini_options]
testpaths = ["tests"]
