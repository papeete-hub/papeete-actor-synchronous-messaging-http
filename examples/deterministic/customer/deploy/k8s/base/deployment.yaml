apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer
  labels:
    app: customer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: customer
  template:
    metadata:
      labels:
        app: customer
    spec:
      containers:
        - name: customer
          image: customer
          ports:
            - containerPort: 8080
          env:
            - name: OTEL_SERVICE_NAME
              value: customer
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.observability.svc.cluster.local:4317
            # ADR-PD-0004 (papeete-deploy >= 0.2.0): every k8s object it applies is renamed
            # with a product-scoped prefix — the Waiter's own Service is
            # `pash-table-service-waiter`, not `waiter`, so HttpMailbox's own name-is-hostname
            # convention needs an override (see app.py's own docstring).
            - name: WAITER_URL
              value: http://pash-table-service-waiter:8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
