data: papeete-actor-data/v0

# THE FIELDS request_schema IS BUILT FROM (ADR-PAS-0009) — checked, not aspirational: it must
# name exactly what `claims.py` actually reads, because `card.py` derives each door's
# request_schema straight from these items.

items:
  - name: subject
    type: string
    description: >-
      What went wrong, or which claim is being reported on.

  - name: means
    type: string
    description: >-
      The grounds given for a claim — kept as a quotation, attributed to whoever gave it,
      never restated as this actor's own finding.

  - name: about
    type: string
    description: >-
      The id of a specific claim to ask about; omitted to ask what my own records hold
      overall.

  - name: asks
    type: string
    description: The question being asked, in prose.

  - name: accepted
    type: boolean
    description: Whether the claim was upheld.

  - name: because
    type: string
    description: The grounds for a judgement, in the judging actor's own words.

  - name: remedy
    type: string
    description: What the claim is owed — a refund, a replacement, a redelivery, and so on.

  - name: claim_id
    type: string
    description: The unique identifier assigned to a newly upheld claim.

  - name: line
    type: string
    description: A one-line, human-readable confirmation of what was recorded.

  - name: says
    type: string
    description: What I am reporting, in prose.

  - name: claims
    type: list
    description: The ids of every claim currently on my own record.
