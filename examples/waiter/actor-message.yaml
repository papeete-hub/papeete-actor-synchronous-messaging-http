message: papeete-actor-message/v1

messages:
  - name: give-table-cmd
    intent: Seat a party at a table.
    references:
      - table_number

  - name: give-table-result
    intent: Report whether a party was seated, and at which table.
    references:
      - accepted
      - table_number

  - name: take-order-cmd
    intent: Register what a customer wants to order, and the grounds given for it.
    references:
      - table_number
      - subject
      - means
    optional:
      - table_number

  - name: accepted-order-result
    intent: Report that a previously placed order was accepted, and its assigned id.
    references:
      - accepted
      - because
      - order_id
      - line
    optional:
      - because

  - name: refused-order-result
    intent: Report that a previously placed order was refused.
    references:
      - accepted
      - because
    optional:
      - because

  - name: order-status-cmd
    intent: Ask for the current state of a previously placed order, or of all of them.
    references:
      - about
      - asks
    optional:
      - about

  - name: order-status-result
    intent: Report what is on record for an order, or the whole order book.
    references:
      - says
      - orders
    optional:
      - orders
